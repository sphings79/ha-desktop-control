name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Swift version
        run: swift --version
      - name: Unit tests
        env:
          SWIFT_BACKTRACE: enable=yes,output-to=stderr,sanitize=no
        run: swift test
      - name: Release build
        run: swift build -c release
