# Deployed to Home Assistant as automation.desktop_control_arbeitszimmer_tur (created via the config API,
# editable in the HA UI). Kept here as a copy for reference.
# Publishes the state of "Arbeitszimmer Tür" as a RETAINED MQTT message for the macOS app.
# Topic: ha-desktop-control/mac_mini_m4/contact/arbeitszimmer_tuer   payload: open | closed

alias: Desktop control - Arbeitszimmer Tür
description: >-
  Sendet den Zustand des Türkontakts retained per MQTT an die macOS-App ha-desktop-control
  (Video pausieren, Browserfenster minimieren).
mode: queued
max_exceeded: silent
triggers:
  - trigger: state
    entity_id: binary_sensor.arbeitszimmer_tur_contact
  - trigger: homeassistant
    event: start
  - trigger: mqtt
    topic: homeassistant/status        # MQTT integration restarted -> resend the state
    payload: online
conditions: []
actions:
  - choose:
      - conditions:
          - condition: state
            entity_id: binary_sensor.arbeitszimmer_tur_contact
            state: "on"
        sequence:
          - action: mqtt.publish
            data:
              topic: ha-desktop-control/mac_mini_m4/contact/arbeitszimmer_tuer
              payload: open
              retain: true
      - conditions:
          - condition: state
            entity_id: binary_sensor.arbeitszimmer_tur_contact
            state: "off"
        sequence:
          - action: mqtt.publish
            data:
              topic: ha-desktop-control/mac_mini_m4/contact/arbeitszimmer_tuer
              payload: closed
              retain: true
